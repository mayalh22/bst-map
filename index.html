<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boston Adventure</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');
  </style>
  <style>
    :root {
      --green:  #00843D;
      --red:    #DA291C;
      --orange: #ED8B00;
      --blue:   #003DA5;
      --cream:  #F5F0E8;
      --ink:    #1A1208;
      --paper:  #EDE8DC;
      --rule:   #C8BFA8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--cream);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    #app { position: relative; z-index: 1; width: 100%; max-width: 680px; }

    /* Header */
    header { text-align: center; margin-bottom: 2.5rem; }
    .mbta-strip { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 1.5rem; }
    .mbta-strip span { flex: 1; }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    header h1 em { font-style: normal; color: var(--green); }
    .tagline { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--rule); margin-top: 0.5rem; }

    /* Card */
    #game-card {
      background: var(--paper);
      color: var(--ink);
      border-radius: 2px;
      padding: 2rem 2.5rem;
      border-top: 4px solid var(--green);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Story */
    #story-log { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; }
    .story-line {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #2a1f0a;
      opacity: 0;
      transform: translateY(6px);
      animation: fadeUp 0.35s ease forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* Choices */
    #choices { display: flex; flex-direction: column; gap: 0.6rem; }
    .choice-btn {
      background: transparent;
      border: 1.5px solid var(--rule);
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      padding: 0.7rem 1rem;
      text-align: left;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .choice-btn .num { font-weight: 700; color: var(--green); min-width: 1.2rem; }
    .choice-btn:hover { background: var(--green); border-color: var(--green); color: white; transform: translateX(4px); }
    .choice-btn:hover .num { color: white; }
    .choice-btn:active { transform: translateX(2px) scale(0.99); }

    /* Start screen */
    #start-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 1.5rem; padding: 2rem 0;
    }
    #start-screen p {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; color: #5a4a2a; max-width: 380px; line-height: 1.6;
    }
    #start-btn {
      background: var(--green); color: white; border: none;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem;
      font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.9rem 2.5rem; cursor: pointer; border-radius: 2px;
      transition: all 0.2s ease; box-shadow: 0 4px 0 #005a2a;
    }
    #start-btn:hover { background: #00a34c; transform: translateY(-2px); box-shadow: 0 6px 0 #005a2a; }
    #start-btn:active { transform: translateY(1px); box-shadow: 0 2px 0 #005a2a; }
    #start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* End screen */
    #end-screen {
      display: flex; flex-direction: column; align-items: center;
      gap: 1.2rem; padding: 1rem 0; text-align: center;
    }
    .end-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--ink); }
    .end-msg { font-size: 0.95rem; color: #5a4a2a; line-height: 1.6; font-family: 'Playfair Display', serif; }
    #restart-btn {
      background: transparent; border: 1.5px solid var(--ink); color: var(--ink);
      font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem;
      letter-spacing: 0.1em; text-transform: uppercase; padding: 0.7rem 2rem;
      cursor: pointer; border-radius: 2px; transition: all 0.15s ease; margin-top: 0.5rem;
    }
    #restart-btn:hover { background: var(--ink); color: var(--cream); }

    /* Trail */
    #trail { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 1.5rem; min-height: 1.4rem; }
    .crumb { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rule); opacity: 0; animation: fadeUp 0.3s ease forwards; }
    .crumb::after { content: ' ›'; color: var(--green); }
    .crumb:last-child::after { content: ''; }

    .kbd-hint { text-align: center; font-size: 0.65rem; color: var(--rule); letter-spacing: 0.1em; margin-top: 0.75rem; }
    kbd { display: inline-block; border: 1px solid var(--rule); border-radius: 2px; padding: 0 4px; font-size: 0.6rem; background: rgba(255,255,255,0.05); }

    #reload-banner {
      background: var(--orange); color: var(--ink); font-size: 0.8rem;
      padding: 0.75rem 1.2rem; border-radius: 2px; margin-bottom: 1.2rem;
      text-align: center; display: none; font-weight: 500;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div id="reload-banner">
    One-time setup complete — <strong>reload this page</strong> to start playing!
  </div>

  <header>
    <div class="mbta-strip">
      <span style="background:#DA291C"></span>
      <span style="background:#ED8B00"></span>
      <span style="background:#00843D"></span>
      <span style="background:#003DA5"></span>
    </div>
    <h1>Boston <em>Adventure</em></h1>
    <p class="tagline">A text adventure set in Boston...By Maya Hazarika!</p>
  </header>

  <div id="game-card">
    <div id="start-screen">
      <p>You wake up at Fenway. The city spreads out before you: boba shops, hidden speakeasies, lost dogs, and one very determined rat.</p>
      <button id="start-btn">Board the T →</button>
    </div>
    <div id="story-log" class="hidden"></div>
    <div id="choices" class="hidden"></div>
    <div id="end-screen" class="hidden">
      <div class="end-title">The End.</div>
      <div class="end-msg" id="end-msg"></div>
      <button id="restart-btn">↩ Play Again</button>
    </div>
  </div>

  <div id="trail"></div>
  <p class="kbd-hint hidden" id="kbd-hint">press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> to choose</p>
</div>

<script>
(async () => {
  // ── Service worker setup ──────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    const existing = await navigator.serviceWorker.getRegistration('./');
    if (!existing) {
      await navigator.serviceWorker.register('./sw.js', { scope: './' });
      document.getElementById('reload-banner').style.display = 'block';
      const btn = document.getElementById('start-btn');
      btn.disabled = true;
      btn.textContent = 'Reload page to play →';
      return;
    }
  }

  if (typeof SharedArrayBuffer === 'undefined') {
    location.reload();
    return;
  }

  // ── UI refs ───────────────────────────────────────────────────────
  const startScreen = document.getElementById('start-screen');
  const storyLog    = document.getElementById('story-log');
  const choicesDiv  = document.getElementById('choices');
  const endScreen   = document.getElementById('end-screen');
  const endMsg      = document.getElementById('end-msg');
  const trail       = document.getElementById('trail');
  const kbdHint     = document.getElementById('kbd-hint');

  let worker     = null;
  let sabView    = null;
  let shownLines = new Set();
  let trailItems = [];
  let alertBuf   = [];   // buffer alert() calls until prompt() arrives
  let waitingForPrompt = false;

  // ── UI helpers ────────────────────────────────────────────────────
  function addLine(text) {
    const el = document.createElement('div');
    el.className = 'story-line';
    el.textContent = text;
    storyLog.appendChild(el);
    storyLog.scrollTop = storyLog.scrollHeight;
  }

  function clearLog() { storyLog.innerHTML = ''; shownLines = new Set(); }

  const locationMap = {
    'fenway': 'Fenway', 'newbury': 'Newbury St', 'newton': 'Newton',
    'alley': 'The Alley', 'boba': 'Boba Shop', 'bookstore': 'Bookstore',
    'cafe': 'Cafe', 'park': 'Newton Park', 'speakeasy': 'Speakeasy',
  };

  function addCrumb(text) {
    if (trailItems[trailItems.length - 1] === text) return;
    trailItems.push(text);
    trail.innerHTML = '';
    trailItems.forEach((t, i) => {
      const el = document.createElement('span');
      el.className = 'crumb';
      el.style.animationDelay = i * 40 + 'ms';
      el.textContent = t;
      trail.appendChild(el);
    });
  }

  function parseAndRender(messages) {
    const narratorLines = [];
    const choices = [];

    for (const msg of messages) {
      if (/^\d+\./.test(msg)) {
        const m = msg.match(/^(\d+)\.\s*(.+)/);
        if (m) choices.push({ key: m[1], label: m[2] });
      } else if (/^>\s*choose/i.test(msg)) {
        // skip
      } else {
        // Skip meta/intro lines that don't add story value
        if (/welcome to boston adventure/i.test(msg)) continue;
        if (/what do you want to do/i.test(msg)) continue;
        if (/invalid choice/i.test(msg)) continue;
        if (!shownLines.has(msg)) narratorLines.push(msg);
      }
    }

    narratorLines.forEach((line, i) => {
      shownLines.add(line);
      setTimeout(() => addLine(line), i * 80);
    });

    const text = narratorLines.join(' ').toLowerCase();
    for (const [key, label] of Object.entries(locationMap)) {
      if (text.includes(key)) {
        setTimeout(() => addCrumb(label), narratorLines.length * 80 + 100);
        break;
      }
    }

    return { narratorLines, choices };
  }

  function showChoices(choices) {
    choicesDiv.classList.remove('hidden');
    choicesDiv.innerHTML = '';
    choices.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="num">${opt.key}</span><span>${opt.label}</span>`;
      btn.dataset.key = String(opt.key);
      btn.onclick = () => sendAnswer(String(opt.key));
      choicesDiv.appendChild(btn);
    });
    kbdHint.classList.remove('hidden');
  }

  function hideChoices() {
    choicesDiv.classList.add('hidden');
    choicesDiv.innerHTML = '';
    kbdHint.classList.add('hidden');
  }

  function sendAnswer(key) {
    if (!sabView) return;
    hideChoices();
    // Write answer directly into SAB and notify the blocked worker
    Atomics.store(sabView, 1, key.charCodeAt(0));
    Atomics.store(sabView, 0, 1);
    Atomics.notify(sabView, 0, 1);
  }

  document.addEventListener('keydown', (e) => {
    if (!waitingForPrompt) return;
    const btn = choicesDiv.querySelector(`[data-key="${e.key}"]`);
    if (btn) {
      btn.style.background = 'var(--green)';
      btn.style.color = 'white';
      setTimeout(() => sendAnswer(e.key), 100);
    }
  });

  // ── Worker message handler ────────────────────────────────────────
  function handleWorkerMessage(e) {
    const { type, msg } = e.data;

    if (type === 'alert') {
      // Buffer alerts — render them when prompt() fires
      alertBuf.push(msg);
      return;
    }

    if (type === 'prompt') {
      waitingForPrompt = true;
      const messages = [...alertBuf];
      alertBuf = [];

      // Check for end scene
      if (messages.some(m => /press enter to continue/i.test(m))) {
        waitingForPrompt = false;
        const endText = messages.filter(m => !/press enter/i.test(m)).join(' ');
        hideChoices();
        storyLog.classList.add('hidden');
        endMsg.textContent = endText;
        endScreen.classList.remove('hidden');
        // Send blank answer so Wasm loop can exit cleanly
        Atomics.store(sabView, 1, 32);
        Atomics.store(sabView, 0, 1);
        Atomics.notify(sabView, 0, 1);
        return;
      }

      const { narratorLines, choices } = parseAndRender(messages);

      if (choices.length === 0) {
        // No choices needed (e.g. quit path) — auto-answer
        waitingForPrompt = false;
        Atomics.store(sabView, 1, 32);
        Atomics.store(sabView, 0, 1);
        Atomics.notify(sabView, 0, 1);
        return;
      }

      setTimeout(() => showChoices(choices), narratorLines.length * 80 + 200);
      return;
    }

    if (type === 'done') {
      waitingForPrompt = false;
      worker = null;
    }
  }

  // ── Start / restart ───────────────────────────────────────────────
  function launchWorker() {
    if (worker) { worker.terminate(); worker = null; }
    alertBuf = [];
    waitingForPrompt = false;

    const sab  = new SharedArrayBuffer(8);
    sabView = new Int32Array(sab);

    worker = new Worker('./game-worker.js', { type: 'module' });
    worker.onmessage = handleWorkerMessage;

    const wasmUrl = new URL('./pkg/boston_adventure.js', location.href).href;
    worker.postMessage({ type: 'init', sab, wasmUrl });
  }

  function startGame() {
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    storyLog.classList.remove('hidden');
    clearLog();
    trailItems = [];
    trail.innerHTML = '';
    launchWorker();
  }

  function restartGame() {
    endScreen.classList.add('hidden');
    storyLog.classList.remove('hidden');
    hideChoices();
    clearLog();
    trailItems = [];
    trail.innerHTML = '';
    launchWorker();
  }

  document.getElementById('start-btn').onclick = startGame;
  document.getElementById('restart-btn').onclick = restartGame;
})();
</script>
</body>
</html>
